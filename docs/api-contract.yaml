components:
  schemas:
    AnnotationIn:
      properties:
        page_no:
          type: integer
          minimum: 1.0
          title: Page No
        kind:
          type: string
          pattern: ^(highlight|note|ink)$
          title: Kind
          default: note
        text:
          type: string
          maxLength: 5000
          title: Text
          default: ''
        bbox:
          anyOf:
          - items:
              type: number
            type: array
            maxItems: 4
            minItems: 4
          - type: 'null'
          title: Bbox
      additionalProperties: false
      type: object
      required:
      - page_no
      title: AnnotationIn
    AnnotationOut:
      properties:
        id:
          type: string
          title: Id
        page_no:
          type: integer
          title: Page No
        kind:
          type: string
          title: Kind
        payload:
          additionalProperties: true
          type: object
          title: Payload
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - page_no
      - kind
      - payload
      - created_at
      - updated_at
      title: AnnotationOut
    Block:
      properties:
        id:
          type: integer
          minimum: 1.0
          title: Id
        text:
          type: string
          maxLength: 10000
          title: Text
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        bbox:
          items:
            type: number
          type: array
          maxItems: 4
          minItems: 4
          title: Bbox
        needs_review:
          type: boolean
          title: Needs Review
          default: true
      additionalProperties: false
      type: object
      required:
      - id
      - text
      - confidence
      - bbox
      title: Block
    Body_upload_api_v1_ocr_files_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
