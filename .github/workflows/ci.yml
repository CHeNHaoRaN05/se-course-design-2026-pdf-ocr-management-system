name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: pdf_system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chinese test font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../pdf_ocr_module/ocr_service/requirements.txt pypdf==5.6.0

      - name: Verify generated OpenAPI contract
        run: python -m backend.scripts.export_contract --check

      # 安装 OCR 的轻量 API/图像依赖，确保契约与检索测试实际执行；不安装 Paddle/模型。
      - name: Run tests
        env:
          PYTHONPATH: ../pdf_ocr_module
          MYSQL_TEST_URL: mysql+pymysql://root:ci-test-only@127.0.0.1:3306/mysql?charset=utf8mb4
          OCR_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: python -m pytest backend/tests ../pdf_ocr_module/ocr_service/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf_system/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build

  frontend-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # ubuntu runner 预装 Google Chrome；用预装浏览器跑 e2e，避免依赖 Playwright 浏览器下载。
      # Windows 保持空值（走默认 chromium-headless-shell）。
      PLAYWRIGHT_CHANNEL: ${{ runner.os == 'Linux' && 'chrome' || '' }}
    defaults:
      run:
        working-directory: pdf_system/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend and real API dependencies
        run: |
          npm ci
          python -m pip install -r ../requirements.txt
      - name: Install Chromium with Linux system dependencies
        if: runner.os == 'Linux'
        # 下载失败不阻断：e2e 已通过 PLAYWRIGHT_CHANNEL=chrome 复用 runner 预装 Chrome。
        continue-on-error: true
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium-headless-shell
      - name: Backend regressions on the same platform
        run: python -m pytest ../backend/tests/test_retest_review.py -q
      - name: Unit tests (shell-independent file discovery)
        run: npm test
      - name: Browser contract and failure regressions
        run: npm run test:e2e
      - name: Real FastAPI + SQLite browser workflow (no route mocking)
        run: npm run test:live
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-${{ matrix.os }}
          path: |
            pdf_system/frontend/test-results/
            pdf_system/frontend/playwright-report/
