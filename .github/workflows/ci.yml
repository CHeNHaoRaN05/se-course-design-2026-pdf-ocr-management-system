name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf_system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chinese test font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../pdf_ocr_module/ocr_service/requirements.txt pypdf==5.6.0

      # 安装 OCR 的轻量 API/图像依赖，确保契约与检索测试实际执行；不安装 Paddle/模型。
      - name: Run tests
        env:
          PYTHONPATH: ../pdf_ocr_module
          OCR_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: python -m pytest backend/tests ../pdf_ocr_module/ocr_service/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf_system/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build

  frontend-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pdf_system/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend and real API dependencies
        run: |
          npm ci
          python -m pip install -r ../requirements.txt
          npx playwright install --with-deps chromium-headless-shell
      - name: Unit tests (shell-independent file discovery)
        run: npm test
      - name: Browser contract and failure regressions
        run: npm run test:e2e
      - name: Real FastAPI + SQLite browser workflow (no route mocking)
        run: npm run test:live
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-${{ matrix.os }}
          path: |
            pdf_system/frontend/test-results/
            pdf_system/frontend/playwright-report/
